# Levanta todo lo que la prueba necesita:  docker compose up -d
services:
  api-horas:
    build: ./servicios/api-horas
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/salud')"]
      interval: 5s
      retries: 10

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: prueba
      POSTGRES_PASSWORD: prueba
      POSTGRES_DB: tablero
    ports:
      - "5432:5432"
